name: Validate MiniMax H3 workflows

on:
  pull_request:
    paths:
      - "minimax-h3/**"
      - ".github/workflows/validate-minimax-h3.yml"
  push:
    branches:
      - main
    paths:
      - "minimax-h3/**"
      - ".github/workflows/validate-minimax-h3.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned so a new comfy-cli release cannot silently change CI semantics.
  COMFY_CLI_VERSION: "1.13.0"
  DO_NOT_TRACK: "1"
  COMFY_NO_TELEMETRY: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  static:
    name: Static and policy validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install official Comfy validator
        run: python -m pip install "comfy-cli==${COMFY_CLI_VERSION}"

      - name: Compile validation helpers
        run: |
          python -m py_compile minimax-h3/tools/validate_workflows.py
          python -m py_compile minimax-h3/tools/comfy_validate.py

      - name: Parse frontend workflows with comfy-cli
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' workflow; do
            echo "Checking frontend export: ${workflow}"
            python -m comfy_cli --json --skip-prompt workflow notes "${workflow}" >/dev/null
          done < <(find minimax-h3 -maxdepth 1 -type f -name '*.json' -print0)

      # A pinned object_info snapshot makes official validation reproducible on
      # a GitHub-hosted runner. Until the snapshot is committed, the live
      # self-hosted job below is the authoritative Comfy-aware validation.
      - name: Validate against pinned ComfyUI schema snapshot
        if: ${{ hashFiles('minimax-h3/ci/object_info.json') != '' }}
        run: >-
          python minimax-h3/tools/comfy_validate.py minimax-h3
          --object-info minimax-h3/ci/object_info.json

      - name: Validate MiniMax H3 repository policies
        run: python minimax-h3/tools/validate_workflows.py minimax-h3

  live-comfy:
    name: Live ComfyUI schema validation
    # Enable after registering a runner labelled `comfyui` whose tested ComfyUI
    # instance has every required custom node loaded. GitHub-hosted runners do
    # not have the repository's NVIDIA/custom-node environment.
    if: ${{ vars.COMFY_LIVE_VALIDATION == 'true' }}
    runs-on: [self-hosted, comfyui]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install official Comfy validator
        run: python -m pip install "comfy-cli==${COMFY_CLI_VERSION}"

      - name: Validate workflows against the running ComfyUI
        env:
          COMFY_VALIDATE_HOST: ${{ vars.COMFY_VALIDATE_HOST }}
          COMFY_VALIDATE_PORT: ${{ vars.COMFY_VALIDATE_PORT }}
        run: python minimax-h3/tools/comfy_validate.py minimax-h3

      # comfy-mcp is intentionally not installed here: its workflow validator
      # shells out to the same comfy-cli command. MCP protocol compatibility is
      # a separate agent-integration smoke test, not a second validation engine.
